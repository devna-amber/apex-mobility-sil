name: Apex Mobility SIL Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sil-verification:
    name: Full 5-Layer SIL Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Toolchain (GCC, NASM, Icarus Verilog, NumPy)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm make iverilog python3-numpy

      - name: Run Master 5-Layer SIL Validation Pipeline
        run: |
          python3 scripts/run_sil_pipeline.py
