name: Apex Mobility SIL Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sil-verification:
    name: Full 11-Layer SIL Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Toolchain & CAN Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm make iverilog python3-numpy can-utils

      - name: Bring Up Virtual CAN Bus (vcan0 if kernel supported)
        run: |
          if sudo modprobe vcan 2>/dev/null; then
            sudo ip link add dev vcan0 type vcan
            sudo ip link set up vcan0
            echo "vcan0 interface active"
          else
            echo "Cloud runner kernel lacks vcan module; falling back to SocketCAN compilation check"
          fi

      - name: Run Master 11-Layer SIL Validation Pipeline
        run: |
          python3 scripts/run_sil_pipeline.py
